[package]
name = "candle-transformers"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
serde_yaml = { version = "0.9", optional = true }
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
candle-nn = { workspace = true }
fancy-regex = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_plain = { workspace = true }
tracing = { workspace = true }

[features]
kimodo-cli = ["dep:anyhow", "dep:clap", "dep:hf-hub", "dep:rand_distr", "dep:serde_yaml"]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate", "candle-nn/accelerate"]
cuda = ["candle/cuda", "candle-nn/cuda"]
cudnn = ["candle/cudnn", "candle-nn/cudnn"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
mkl = ["dep:intel-mkl-src", "candle/mkl", "candle-nn/mkl"]
metal = ["candle/metal", "candle-nn/metal"]
metal-debug-labels = ["metal", "candle/metal-debug-labels", "candle-nn/metal-debug-labels"]

[[bin]]
name = "kimodo"
path = "src/bin/kimodo.rs"
required-features = ["kimodo-cli"]
