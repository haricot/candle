[package]
name="haricot-wham-lite-candle"
version="0.3.4"
edition="2021"
license="Apache-2.0"
[workspace]
resolver="2"
[features]
default=[]
cuda=["candle-core/cuda","candle-nn/cuda"]
cudnn=["cuda","candle-core/cudnn","candle-nn/cudnn"]
[dependencies]
anyhow="1"
candle-core={path="../candle-core"}
candle-nn={path="../candle-nn"}
serde={version="1",features=["derive"]}
serde_json="1"
[[bin]]
name="haricot-wham-lite"
path="src/main.rs"
