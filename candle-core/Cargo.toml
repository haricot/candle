[package]
name = "candle-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
cutile = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true, features = ["zerocopy"] }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
yoke = { workspace = true }
zerocopy = { workspace = true }
zip = { workspace = true }
parking_lot = "0.12.5"
sha2 = { version = "0.10", optional = true }
dkr-kernel-registry = { path = "../dkr-kernel-registry", version = "0.1.0", optional = true }
serde_json = { workspace = true, optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["fancy-regex"] }

[dev-dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }

[build-dependencies]
serde_json.workspace = true
sha2 = "0.10"
dkr-kernel-registry = { path = "../dkr-kernel-registry", version = "0.1.0" }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels"]
# Native catalogue consumer. This does not enable any legacy CUDA producer flags.
cuda-dkr-catalog = ["cuda", "candle-kernels/cuda-dkr-catalog", "dep:sha2", "dep:serde_json", "dep:dkr-kernel-registry"]
# Strict deployment build: requires an embedded catalogue and disallows runtime overrides.
cuda-dkr-embedded = ["cuda-dkr-catalog", "candle-kernels/cuda-dkr-embedded"]
# Experimental exact-target, build-verified CUBIN images. All 25 entries required.
cuda-dkr-cubin-embedded = ["cuda-dkr-embedded"]
# S5.5 experimental producer-owned MMQ geometry: opt-in for PTX or CUBIN.
cuda-dkr-neutral-mmq = ["cuda-dkr-embedded"]
# S5.5b producer-owned FP8, FP4, BF16 and Routed recipes.
cuda-dkr-neutral-recipes = ["cuda-dkr-neutral-mmq"]
# S5.5c: strict standalone Cudaforge producer attestation + embedded CUBIN.
cuda-dkr-cudaforge-catalog = ["cuda-dkr-neutral-recipes", "cuda-dkr-cubin-embedded"]
# R1.25 P1: default to verified CUBIN on the catalogue target, with explicit PTX rollback.
cuda-dkr-qualified-default = ["cuda-dkr-cudaforge-catalog"]
# R1.25/P2 qualification-only fault; never include in an application build.
cuda-dkr-p2-test-fault = ["cuda-dkr-qualified-default"]
# Historical hybrid/static compatibility. Retain the previous public feature.
cuda-dkr-s31 = ["cuda-dkr-catalog", "cuda-legacy-bf16", "cuda-legacy-fp8", "cuda-legacy-fp4"]
cuda-legacy-bf16 = ["cuda", "candle-kernels/cuda-legacy-bf16"]
cuda-legacy-fp8 = ["cuda", "candle-kernels/cuda-legacy-fp8"]
# Opt-in software NVFP4 E2M1/E4M3FN kernels on Pascal and other pre-native devices.
# MXFP4 remains available normally; this is not native FP4 Tensor Core support.
cuda-legacy-fp4 = ["cuda", "candle-kernels/cuda-legacy-fp4"]
cutile = ["cuda", "dep:cutile"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "cutile"
required-features = ["cutile"]
