name: CUDA sm61 validation

on:
  workflow_dispatch:
  push:
    tags:
      - cuda-sm61-test-*

permissions:
  contents: read

jobs:
  cuda-sm61-suite:
    name: CUDA sm61 local suite
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 120
    env:
      CUDA_COMPUTE_CAP: 61
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Show CUDA environment
        run: |
          nvidia-smi
          nvcc --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Test legacy BF16 and FP8
        run: |
          cargo test -p candle-core \
            --features "cuda cuda-legacy-bf16 cuda-legacy-fp8" \
            --test cuda_legacy_bf16_tests \
            --test fp8_legacy_tests \
            -- --nocapture

      - name: Test CUDA convolutions without cuDNN
        run: |
          cargo test -p candle-core \
            --features "cuda" \
            --test conv_tests \
            -- --nocapture

      - name: Test CUDA convolutions with cuDNN fallback
        run: |
          cargo test -p candle-core \
            --features "cuda cudnn" \
            --test conv_tests \
            -- --nocapture
