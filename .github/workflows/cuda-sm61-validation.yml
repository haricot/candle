name: CUDA sm61 validation

on:
  workflow_dispatch:
  push:
    tags:
      - cuda-sm61-test-*

permissions:
  contents: read

jobs:
  cuda-sm61-suite:
    name: CUDA sm61 local suite
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 120
    env:
      CUDA_COMPUTE_CAP: 61
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate CUDA environment
        shell: bash
        run: |
          test "$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -n 1)" = "6.1"
          nvcc --version >/dev/null
          echo "CUDA sm61 runner ready"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Test legacy BF16 and FP8
        id: legacy
        continue-on-error: true
        run: |
          cargo test -p candle-core \
            --features "cuda cuda-legacy-bf16 cuda-legacy-fp8" \
            --test cuda_legacy_bf16_tests \
            --test fp8_legacy_tests \
            -- --nocapture

      - name: Test CUDA convolutions without cuDNN
        id: conv_cuda
        continue-on-error: true
        run: |
          cargo test -p candle-core \
            --features "cuda" \
            --test conv_tests \
            -- --nocapture

      - name: Test CUDA convolutions with cuDNN fallback
        id: conv_cudnn
        continue-on-error: true
        run: |
          cargo test -p candle-core \
            --features "cuda cudnn" \
            --test conv_tests \
            -- --nocapture

      - name: Enforce validation result
        if: always()
        env:
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          CUDA_OUTCOME: ${{ steps.conv_cuda.outcome }}
          CUDNN_OUTCOME: ${{ steps.conv_cudnn.outcome }}
        run: |
          echo "legacy=${LEGACY_OUTCOME}"
          echo "cuda=${CUDA_OUTCOME}"
          echo "cudnn=${CUDNN_OUTCOME}"
          test "${LEGACY_OUTCOME}" = success
          test "${CUDA_OUTCOME}" = success
          test "${CUDNN_OUTCOME}" = success
