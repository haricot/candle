name: CUDA sm61 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conv-tests:
    name: conv-tests (${{ matrix.name }})
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda
            features: cuda
          - name: cuda-cudnn
            features: cuda cudnn
    env:
      CUDA_COMPUTE_CAP: 61
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Show CUDA environment
        run: |
          nvidia-smi
          nvcc --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Run existing convolution tests
        run: cargo test -p candle-core --features "${{ matrix.features }}" --test conv_tests -- --nocapture
