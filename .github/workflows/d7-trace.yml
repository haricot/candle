name: STS — Semantic Trace & Stateful Standalone (CPU)
on:
  push:
    branches: [semantic-trace-stateful-main-standalone]
  pull_request:
    branches: [main, orch/unified-candle-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-and-stateful-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - run: cargo check -p candle-core --no-default-features
      - run: cargo check -p candle-core --features d7-trace
      - run: cargo test -p candle-core --features d7-trace --test d7_diagnostics
      - run: cargo run -p candle-core --features d7-trace --example d7_shortconv_validate -- cpu "$RUNNER_TEMP/d7-state-validation"
