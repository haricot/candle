name: Extended dynamic manifest smoke

on:
  push:
    branches: [orch/extended-dynamic-v2, orch/extended-cuda-manifest-fix]
    paths:
      - ".github/scripts/candle-extended-assemble.sh"
      - ".github/scripts/candle-extended-cpu.sh"
      - ".github/scripts/candle-extended-sm61.sh"
      - ".github/scripts/candle-candidate-cuda-compile.sh"
      - ".github/scripts/extended-dynamic-selftest.sh"
      - ".github/extended-sources.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest_6_7_8:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify manifest-driven cardinalities and shell syntax
        run: bash .github/scripts/extended-dynamic-selftest.sh
 
  preview_exact_eight_sources:
    name: Non-publishing eight-source exact-delta preview
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compose and verify all exact source deltas (without publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: dryrun-${{ github.run_id }}-${{ github.run_attempt }}
          STRATEGY: exact-delta
          PUBLISH: 'false'
        run: bash .github/scripts/candle-extended-assemble.sh
      - name: Require exact CUDA capability parity in the assembled candidate
        run: |
          set -euo pipefail
          jq -e --slurpfile cfg .github/extended-sources.json '
            .schema_version == 1 and .kind == "extended-multi" and
            .feature_count == ($cfg[0].features|length) and
            [.features[]|{feature,cuda_features}] ==
              [$cfg[0].features[]|{feature,cuda_features}] and
            ([.features[].cuda_features[]] | unique) ==
              ([$cfg[0].features[].cuda_features[]] | unique)
          ' "$RUNNER_TEMP/candle-extended/extended.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-nonpublishing-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/candle-extended/
          if-no-files-found: warn
          retention-days: 14
