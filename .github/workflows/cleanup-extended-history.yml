name: One-shot Extended history cleanup

on:
  push:
    branches: [mirror_orch]
    paths:
      - .github/workflows/cleanup-extended-history.yml

permissions:
  contents: write

concurrency:
  group: cleanup-extended-history-37778094617
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: mirror_orch
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable qualification anchors
        shell: bash
        run: |
          set -euo pipefail
          exact_head() {
            local ref="$1" expected="$2"
            local actual
            actual="$(git ls-remote --heads origin "refs/heads/$ref" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::anchor mismatch ref=$ref expected=$expected actual=$actual"
              exit 3
            fi
            echo "ANCHOR_OK ref=$ref sha=$actual"
          }
          exact_head extended 892538754597c26e730c45c954821a20572b3f7e
          exact_head archive/extended/sm61-validated-37778094617 892538754597c26e730c45c954821a20572b3f7e
          exact_head orch/extended-v1 77bdbd1a50972de3564bb2a194bfbc00911858d7
          exact_head asd_core_v3_standalone aef4738f8ef513ef425dbaa345358cdd3ae8cbb7
          exact_head integration/extended/candidate/extended-37778094617-1 892538754597c26e730c45c954821a20572b3f7e

      - name: Delete exact obsolete refs
        shell: bash
        run: |
          set -euo pipefail
          deleted=0

          delete_exact() {
            local ref="$1" expected="$2"
            local actual
            actual="$(git ls-remote --heads origin "refs/heads/$ref" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then
              echo "ALREADY_ABSENT ref=$ref"
              return 0
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::ref moved; refusing delete ref=$ref expected=$expected actual=$actual"
              exit 3
            fi
            git push origin --delete "$ref"
            if git ls-remote --exit-code --heads origin "refs/heads/$ref" >/dev/null 2>&1; then
              echo "::error::delete verification failed ref=$ref"
              exit 3
            fi
            echo "DELETED ref=$ref sha=$expected"
            deleted=$((deleted + 1))
          }

          delete_exact integration/extended/candidate/extended-37772812039-1 2c57990e0a9871b6f65007ec766c9200d29a4e6c
          delete_exact integration/extended/candidate/extended-37775263397-1 f07d54398628871a78cb1da29f8e1e6c65f2372e

          delete_exact prepare/extended/extended-37772812039-1/asd_core_v3_standalone 9ba03ae80c595eb2815ffd87036d1089c3087436
          delete_exact prepare/extended/extended-37772812039-1/bf16_candle 450db82c96e451d694696db2d531a69f53230d78
          delete_exact prepare/extended/extended-37772812039-1/cudnn_fallback_candle 29cbead7a25deb136a8adb7e8d844cfcf1fcaf12
          delete_exact prepare/extended/extended-37772812039-1/fp4_candle c7c288a2256d36a5c4b6f87a95dff349469e3221
          delete_exact prepare/extended/extended-37772812039-1/fp8_candle 6da34ca65103dafdf9177656832e9feaaf96dcb7
          delete_exact prepare/extended/extended-37772812039-1/moe_simt_f16_candle 5c476e32012fd0efa5f82225e1a38f6a99f36eb0

          delete_exact prepare/extended/extended-37775263397-1/asd_core_v3_standalone 1cfd563e891d41f01ccf39c97001aa1342b4166b
          delete_exact prepare/extended/extended-37775263397-1/bf16_candle 340a3d9763f43d62e1f006223e70ad2c7aed53b5
          delete_exact prepare/extended/extended-37775263397-1/cudnn_fallback_candle 1067c894a2bccedf7d636a6ade50f7f480f6122e
          delete_exact prepare/extended/extended-37775263397-1/fp4_candle 943c2164cde164e14f402b83d868d4ccb71df20f
          delete_exact prepare/extended/extended-37775263397-1/fp8_candle c6678d485bb16f7a3ddd3549d4fbe3ca9453c376
          delete_exact prepare/extended/extended-37775263397-1/moe_simt_f16_candle 62680e1d3a25e0b20ff842f8a53f2d4b5f5f442f

          delete_exact prepare/extended/extended-37778094617-1/asd_core_v3_standalone 651c477ba5e2a6546f0e64ced920209f2266985a
          delete_exact prepare/extended/extended-37778094617-1/bf16_candle d557ed4fe03be11e2f416e4eac8310d227f48bf2
          delete_exact prepare/extended/extended-37778094617-1/cudnn_fallback_candle 6a8cf42d567189d4266479c6130e175050e19f46
          delete_exact prepare/extended/extended-37778094617-1/fp4_candle 6f05fe61db7f842c9607416f41a2ef8fea24b533
          delete_exact prepare/extended/extended-37778094617-1/fp8_candle 6dc13eaa961b4394d2ec5f7fab7cbce5df2068b5
          delete_exact prepare/extended/extended-37778094617-1/moe_simt_f16_candle 261675ab9f2b463091f64f5097a756b199ee30d7

          delete_exact asd_core 0b6bde38b36b89f185a15d77798de6f2f586e101
          delete_exact asd_core_v3 6a49b16b62ec3c9fa395db512dda766b79b701b4
          delete_exact asd_core_v3_phase_d_generic_runtime 9386faa753106bbaca1367b2c069561a2814904e
          delete_exact extract/asd_core-v1 b0281c1339b43f52439d2e7ef02335bbc03f74a6

          delete_exact cuda_asd_runner 0835f4a7d57c6c190305ed9c41713c867ffb34d7
          delete_exact cuda_asd_runner_v2 ac983d16750a136a8563def01926ee83a7831d22
          delete_exact cuda_asd_runner_v3 89adbfa5b8af544f65ad33c7d2facf389e58704e
          delete_exact cuda_asd_runner_extended cce3b4cedfec79b31a04bbc93edda58c4eae59f7

          echo "CLEANUP_EXTENDED_HISTORY=PASS deleted=$deleted"
          echo "## Extended history cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- qualification run: 37778094617" >> "$GITHUB_STEP_SUMMARY"
          echo "- validated candidate: `892538754597c26e730c45c954821a20572b3f7e`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deleted refs: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "- kept: `extended`, `orch/extended-v1`, successful candidate, source feature branches, archives" >> "$GITHUB_STEP_SUMMARY"
