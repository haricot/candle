name: FP4 one-time rustfmt
on:
  push:
    branches:
      - rebase/20260925-aebc405d/fp4_candle-format-work
    paths:
      - .github/workflows/fp4-format-once.yml
permissions:
  contents: write
jobs:
  format-and-commit:
    if: github.ref == 'refs/heads/rebase/20260925-aebc405d/fp4_candle-format-work'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply rustfmt and permit only four FP4 or shared build paths
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          allowed='^(candle-core/src/quantized/cuda.rs|candle-core/tests/mxfp4_tests.rs|candle-core/tests/nvfp4_experiment.rs|candle-kernels/build.rs)$'
          while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || {
              echo "::error::Unexpected rustfmt change to $path; refusing to commit"
              exit 2
            }
          done < <(git diff --name-only)
          cargo fmt --all -- --check
          git add -- candle-core/src/quantized/cuda.rs             candle-core/tests/mxfp4_tests.rs             candle-core/tests/nvfp4_experiment.rs             candle-kernels/build.rs
          if git diff --cached --quiet; then
            echo "Already rustfmt clean" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(fp4): apply rustfmt 1.98 after repairing SM61 baseline"
            git push origin HEAD:refs/heads/rebase/20260925-aebc405d/fp4_candle-format-work
            git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
