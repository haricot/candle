# One-time retry of hosted CUDA checks after fixing runner-owned checkout trust.
# The earlier FP8 rebase and format-only candidate remain immutable.
name: FP8 candidate CI retry
on:
  push:
    branches: [mirror_orch]
    paths: [.github/workflows/fp8-rebase-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: b7aaf4509fdc1c4e5f79cad14e0fb3460d401148
      CANDIDATE_REF: rebase/20260925-aebc405d/fp8_candle-fmt1
      UPSTREAM_SHA: aebc405d2b4bf42808387e0ca597bf7dad9b565f
      CAMPAIGN: fp8-rebase-20260925-aebc405d-cuda-retry1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged candidate and retry CPU plus CUDA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$CANDIDATE_REF:refs/remotes/origin/fp8-retry"
          actual="$(git rev-parse refs/remotes/origin/fp8-retry)"
          [[ "$actual" == "$CANDIDATE_SHA" ]] || {
            echo "::error::Candidate changed; refusing CI retry"; exit 3;
          }
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$CANDIDATE_SHA"
          gh workflow run candle-candidate-ci.yml --repo "$GITHUB_REPOSITORY" \
            --ref mirror_orch -f branch=fp8_candle -f campaign="$CAMPAIGN" \
            -f candidate_ref="$CANDIDATE_REF" -f candidate_sha="$CANDIDATE_SHA" \
            -f upstream_sha="$UPSTREAM_SHA" -f validation=cpu_cuda
          echo "Retried CPU and CUDA checks on unchanged FP8 candidate $CANDIDATE_SHA" \
            >> "$GITHUB_STEP_SUMMARY"
