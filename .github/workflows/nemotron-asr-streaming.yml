name: Nemotron 3.5 ASR standalone initial contracts

on:
  push:
    branches: [nemotron_asr_streaming_standalone]
    paths:
      - 'candle-transformers/src/models/nemotron3_5_asr/**'
      - 'candle-transformers/src/models/mod.rs'
      - '.github/workflows/nemotron-asr-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initial-model-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Format new module
        run: rustfmt --edition 2021 --check candle-transformers/src/models/nemotron3_5_asr/mod.rs
      - name: Official config and language projection contracts (no ASR parity claim)
        run: cargo test -p candle-transformers --lib nemotron3_5_asr
