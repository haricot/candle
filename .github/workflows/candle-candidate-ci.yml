            if [[ ( "$CHECK_BRANCH" == moe_simt_f16_candle || "$CHECK_BRANCH" == cuda_asd_runner_v2 ) && "$check_rc" -eq 0 ]]; then
              # The selector is pure Rust; compile and execute its unit tests
              # without loading CUDA libraries or requiring a hosted GPU.
              rustc --edition=2021 --test candle-kernels/src/moe_selection.rs \
                -o "$RUNNER_TEMP/moe-selection-tests" \
                > "$report/moe-selection-tests.log" 2>&1 || test_rc=$?
              if ((test_rc == 0)); then
                "$RUNNER_TEMP/moe-selection-tests" --nocapture \
                  >> "$report/moe-selection-tests.log" 2>&1 || test_rc=$?
              fi
            fi
          fi
          lock_sha=""
          if [[ -f Cargo.lock ]]; then
            cp Cargo.lock "$report/Cargo.lock"
            lock_sha="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          fi
