          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile > "$report/lock.log" 2>&1 || lock_rc=$?
          else
            echo "Using candidate Cargo.lock" > "$report/lock.log"
          fi
          if ((lock_rc == 0)); then
            cargo check -p candle-core -p candle-nn --no-default-features --locked \
              > "$report/cpu-check.log" 2>&1 || check_rc=$?
            if [[ ( "$CHECK_BRANCH" == asd_core || "$CHECK_BRANCH" == cuda_asd_runner_v2 ) && "$check_rc" -eq 0 ]]; then
              cargo test -p candle-core --no-default-features --locked \
                --test grouped_conv_core_tests --test grouped_conv_transpose_core_tests \
                > "$report/grouped-cpu-tests.log" 2>&1 || test_rc=$?
            fi
            if [[ ( "$CHECK_BRANCH" == fp4_candle || "$CHECK_BRANCH" == cuda_asd_runner_v2 || "$CHECK_BRANCH" == standalone_fp48_integration ) && "$check_rc" -eq 0 ]]; then
              cargo test -p candle-core --no-default-features --locked \
