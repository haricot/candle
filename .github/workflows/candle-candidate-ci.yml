              log="$report/$item.log"
              [[ -s "$log" ]] || continue
              echo "::group::$item.log (last 35 lines)"
              tail -n 35 "$log"
              echo "::endgroup::"
            done
          fi
          [[ "$status" == CPU_PASSED ]]

      - name: Upload CPU proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 / Node 24
        with:
          name: candidate-${{ inputs.campaign }}-${{ inputs.branch }}-cpu
          path: ${{ runner.temp }}/candle-candidate-cpu/
          if-no-files-found: warn
          retention-days: 21

  cuda_compile:
    name: CUDA 12.9 SM61 compile / ${{ inputs.branch }}
    needs: cpu
    if: needs.cpu.result == 'success' && inputs.validation == 'cpu_cuda'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CUDA_COMPUTE_CAP: "61"
      CARGO_INCREMENTAL: "0"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      CHECK_BRANCH: ${{ inputs.branch }}
      CHECK_CAMPAIGN: ${{ inputs.campaign }}
      LOCK_SHA256: ${{ needs.cpu.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # Node24
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      # The candidate is the original immutable six-source SHA. Fetch only
      # the container recipe and compile harness from this workflow's
      # orchestration commit, so the source candidate does not move.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # Node24
        with:
          name: candidate-${{ inputs.campaign }}-${{ inputs.branch }}-cpu
          path: ${{ runner.temp }}/candidate-cpu-proof

      - name: Build Ubuntu 26.04 CUDA 12.9.2 compiler container
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --file .ci-tools/.github/container/Containerfile.cuda1292-ubuntu2604 \
            --tag candle-cuda1292-u2604:candidate \
            .ci-tools/.github/container
          docker image inspect candle-cuda1292-u2604:candidate --format '{{.Id}}'

      - name: CUDA compilation without executing GPU kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuda-home" "$RUNNER_TEMP/cuda-cargo"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/cuda-home" \
            --env "CARGO_HOME=$RUNNER_TEMP/cuda-cargo" \
            --env "RUSTUP_HOME=/opt/rustup" \
            --env CUDA_COMPUTE_CAP --env CARGO_INCREMENTAL \
            --env GITHUB_WORKSPACE --env RUNNER_TEMP --env GITHUB_STEP_SUMMARY \
            --env CANDIDATE_SHA --env CANDIDATE_REF --env CHECK_BRANCH --env CHECK_CAMPAIGN --env LOCK_SHA256 \
            candle-cuda1292-u2604:candidate \
            bash "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-candidate-cuda-compile.sh"

      - name: Upload CUDA compilation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Node24
