          fi
          jq -n \
            --arg branch "$CHECK_BRANCH" --arg campaign "$CHECK_CAMPAIGN" \
            --arg sha "$CANDIDATE_SHA" --arg upstream "$UPSTREAM_SHA" \
            --arg status "$status" --arg lock "$lock_sha" \
            --argjson fmt "$fmt_rc" --argjson lock_rc "$lock_rc" \
            --argjson cpu "$check_rc" --argjson tests "$test_rc" \
            '{branch:$branch,campaign:$campaign,candidate_sha:$sha,upstream_sha:$upstream,
              status:$status,lock_sha256:$lock,exit_codes:{fmt:$fmt,lock:$lock_rc,
              cpu:$cpu,grouped_cpu_tests:$tests,targeted_tests:$tests}}' > "$report/report.json"
          {
            echo "CPU: $status / $CHECK_BRANCH / $CANDIDATE_SHA"
            echo "Exit codes: fmt=$fmt_rc, lock=$lock_rc, cpu=$check_rc, targeted_tests=$test_rc"
            echo "Cargo.lock SHA-256: $lock_sha"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != CPU_PASSED ]]; then
            echo "::error::Candidate CPU gate failed: fmt=$fmt_rc, lock=$lock_rc, cpu=$check_rc, targeted_tests=$test_rc"
