name: Candle Six — Remove Duplicate Standalone Aliases
on:
  push:
    branches: [mirror_orch]
    paths:
      - .github/six-standalone-alias-cleanup-launch.json
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Delete only six exact duplicate standalone aliases
        shell: bash
        run: bash .github/scripts/candle-six-standalone-alias-cleanup.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: six-standalone-alias-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/six-standalone-alias-cleanup/
          if-no-files-found: warn
          retention-days: 90
