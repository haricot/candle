name: Candle release build and CPU target contracts
on:
  push:
    branches: [ci/candle-release-profile-extended, ci/candle-release-profile-legacy]
permissions:
  contents: read
concurrency:
  group: candle-build-once-contracts-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.99.0'
      - name: Check explicit CPU targets and actual release build reuse
        run: python3 -B .github/scripts/candle-build-profile-selftest.py
      - name: Check immutable archive execution contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in extended-build-once-selftest.py legacy-build-once-selftest.py; do
            if [[ -f ".github/scripts/$test" ]]; then
              python3 -B ".github/scripts/$test"
            fi
          done
          bash -n .github/scripts/candle-candidate-cuda-compile.sh
