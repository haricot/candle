name: Candle SM61 historical workflow and branch cleanup
on:
  push:
    branches: [mirror_orch]
    paths: [.github/cleanup-sm61-20261030.json]
permissions:
  contents: read
concurrency:
  group: candle-sm61-hygiene
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify archive, collision and atomic lease behavior
        run: python3 -B -m unittest discover -v -s .github/scripts/tests -p test_candle_sm61_hygiene.py
      - name: Apply the exact checked request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/candle-sm61-hygiene.py --report "$RUNNER_TEMP/candle-hygiene/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candle-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candle-hygiene/
          if-no-files-found: warn
          retention-days: 90
