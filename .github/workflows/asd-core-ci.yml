name: ASD Core CPU validation
on:
  push:
    branches:
      - asd_core
      - extract/asd_core-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grouped-cpu:
    name: Grouped convolution CPU baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check candle-core without CUDA
        run: cargo check -p candle-core --no-default-features
      - name: Test grouped convolutions and transpose on CPU
        run: |
          cargo test -p candle-core --no-default-features \
            --test grouped_conv_core_tests --test grouped_conv_transpose_core_tests
