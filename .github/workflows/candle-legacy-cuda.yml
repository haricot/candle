name: Candle Legacy CUDA — Hosted CI
# base-sync-main: c68b24997319b8d76e5a4e775dab197c7f26322a fp4=be550c3d02d169a79120d53e008c19e5a7c5ec1f

on:
  push:
    branches: [orch/legacy-cuda-v1]
    paths:
      - .github/workflows/candle-legacy-cuda.yml
      - .github/legacy-cuda-sources.json
      - .github/scripts/candle-legacy-assemble.sh
      - .github/scripts/candle-legacy-cpu.sh
      - .github/scripts/candle-legacy-sm61.sh
      - .github/scripts/candle-candidate-cuda-compile.sh
      - .github/scripts/candle-extended-build-once.py
      - .github/container/cuda-image.json
      - .github/workflows/candle-cuda-ci-image.yml
      - .github/scripts/candle-promote-validated.sh
      - .github/scripts/candle-resolve-bf16-fp8.sh
      - .github/scripts/candle-resolve-bf16-fp8-fp4.sh
      - .github/scripts/candle-resolve-bf16-fp8-fp4-cudnn.sh
      - .github/scripts/candle-resolve-bf16-fp8-fp4-moe.sh
      - .github/resolutions/**
  workflow_dispatch:
    inputs:
      campaign:
        description: Immutable campaign name
        type: string
        required: true
      base_sha:
        description: Optional exact fork main SHA
        type: string
        required: false
      publish:
        description: Publish immutable temporary refs for hosted validation
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: candle-legacy-cuda-${{ github.event_name == 'push' && github.sha || inputs.campaign }}
  cancel-in-progress: false

jobs:
  cuda_image:
    uses: ./.github/workflows/candle-cuda-ci-image.yml
    permissions:
      contents: read
      packages: write

  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.assemble.outputs.candidate_sha }}
      candidate_ref: ${{ steps.assemble.outputs.candidate_ref }}
      campaign: ${{ steps.assemble.outputs.campaign }}
      base_sha: ${{ steps.assemble.outputs.base_sha }}
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
      matrix: ${{ steps.assemble.outputs.matrix }}
      published: ${{ steps.assemble.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hosted Legacy archive coverage before assembly
        run: python3 .github/scripts/legacy-build-once-selftest.py
      - name: Prepare exact five-feature legacy-cuda candidate
        id: assemble
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ github.event_name == 'push' && format('legacy-{0}-{1}', github.run_id, github.run_attempt) || inputs.campaign }}
          STRATEGY: exact-delta
          BASE_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || '' }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: bash .github/scripts/candle-legacy-assemble.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/candle-legacy-cuda/
          if-no-files-found: warn
          retention-days: 30

  standalone_cpu:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      MODE: standalone
      FEATURE: ${{ matrix.feature }}
      SOURCE: ${{ matrix.source_sha }}
      SHA: ${{ matrix.prepared_sha }}
      CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.prepared_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt
      - name: Independent feature CPU gate
        run: bash .ci-tools/.github/scripts/candle-six-cpu.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-${{ matrix.feature }}-cpu
          path: ${{ runner.temp }}/six-standalone-cpu/
          if-no-files-found: warn
          retention-days: 30

  integrated_cpu:
    needs: [prepare, standalone_cpu]
    if: needs.standalone_cpu.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      lock_sha256: ${{ steps.check.outputs.lock_sha256 }}
    env:
      SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
      MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt
      - id: check
        run: bash .ci-tools/.github/scripts/candle-legacy-cpu.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-integrated-cpu
          path: ${{ runner.temp }}/legacy-integrated-cpu/
          if-no-files-found: warn
          retention-days: 30

  integrated_cuda_compile:
    needs: [prepare, integrated_cpu, cuda_image]
    if: needs.integrated_cpu.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 210
    outputs:
      hosted_manifest_sha256: ${{ steps.build_once.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
      CHECK_BRANCH: legacy_cuda_integration
      CHECK_CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
      LOCK_SHA256: ${{ needs.integrated_cpu.outputs.lock_sha256 }}
      CUDA_COMPUTE_CAP: '61'
      CARGO_INCREMENTAL: '0'
      CANDLE_BUILD_SOURCE: legacy
      CANDLE_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-integrated-cpu
          path: ${{ runner.temp }}/candidate-cpu-proof
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cuda_cache
        with:
          path: |
            ${{ runner.temp }}/cuda-cargo
            target
          key: candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-${{ needs.prepare.outputs.base_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-${{ needs.prepare.outputs.base_sha }}-
            candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-
      - name: Pull the verified immutable CUDA environment
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CANDLE_CUDA_IMAGE"
      - shell: bash
        id: build_once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuda-home" "$RUNNER_TEMP/cuda-cargo"
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/cuda-home" \
            --env "CARGO_HOME=$RUNNER_TEMP/cuda-cargo" \
            --env RUSTUP_HOME=/opt/rustup \
            --env CUDA_COMPUTE_CAP --env CARGO_INCREMENTAL --env CANDLE_BUILD_SOURCE --env CANDLE_CUDA_IMAGE \
            --env GITHUB_WORKSPACE --env RUNNER_TEMP --env GITHUB_STEP_SUMMARY \
            --env CANDIDATE_SHA --env CANDIDATE_REF --env CHECK_BRANCH \
            --env CHECK_CAMPAIGN --env LOCK_SHA256 \
            "$CANDLE_CUDA_IMAGE" \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              bash "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-candidate-cuda-compile.sh"
              python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-extended-build-once.py" \
                build --out "$RUNNER_TEMP/legacy-sm61-build-once"
            '
          echo "manifest_sha256=$(sha256sum "$RUNNER_TEMP/legacy-sm61-build-once/manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cuda_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/cuda-cargo
            target
          key: ${{ steps.cuda_cache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-cuda-compile
          path: ${{ runner.temp }}/candle-candidate-cuda/
          if-no-files-found: warn
          retention-days: 30
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-build-once
          path: ${{ runner.temp }}/legacy-sm61-build-once/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  physical_sm61:
    name: SM61 legacy runtime
    needs: [prepare, integrated_cuda_compile, cuda_image]
    if: needs.integrated_cuda_compile.result == 'success'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - cuda
      - sm61
      - candle-legacy
      - legacy-${{ github.run_id }}
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CUDA_COMPUTE_CAP: '61'
      NVCC: /opt/cuda/bin/nvcc
      NVCC_CCBIN: gcc-14
      CARGO_INCREMENTAL: '0'
      CANDLE_BUILD_SOURCE: legacy
      CANDLE_BUILD_ONCE_EXECUTOR: physical-sm61
      CANDLE_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
      EXTENDED_BUILD_ONCE_MANIFEST_SHA256: ${{ needs.integrated_cuda_compile.outputs.hosted_manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-build-once
          path: ${{ runner.temp }}/legacy-sm61-build-once
      - name: Validate integrated legacy CUDA on physical SM61
        shell: bash
        env:
          CANDLE_LEGACY_BUILD_ONCE_DIR: ${{ runner.temp }}/legacy-sm61-build-once
        run: bash .ci-tools/.github/scripts/candle-legacy-sm61.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-sm61
          path: ${{ runner.temp }}/legacy-sm61-proof/
          if-no-files-found: warn
          retention-days: 30

  promote_validated:
    name: Promote validated Legacy refs
    needs: [prepare, physical_sm61]
    if: needs.physical_sm61.result == 'success' && needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
      CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      TARGET_BRANCH: cuda_legacy
      MANIFEST_PATH: candle-integration/legacy-cuda.json
      PROMOTION_KIND: legacy
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive and atomically promote validated refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/candle-promote-validated.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-${{ needs.prepare.outputs.campaign }}-promotion
          path: ${{ runner.temp }}/candle-promotion/
          if-no-files-found: warn
          retention-days: 30

