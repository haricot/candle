name: Candle hosted disk cleanup contracts
on:
  push:
    branches: [ci/candle-hosted-disk-fix]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python3 -B .github/scripts/free-hosted-disk-selftest.py
      - run: bash -n .github/scripts/free-hosted-disk.sh
      - run: python3 .github/scripts/ci-cuda-image-selftest.py
      - run: python3 .github/scripts/ci-cuda-image.py identity --spec .github/container/cuda-image.json
