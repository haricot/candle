name: Candle CUDA 12.9.2 Candidate Request
# A reviewed one-shot request. Keep the new SM61 physical run separated
# from GitHub-hosted CPU/CUDA compilation and disable automatic promotion.
on:
  push:
    branches: [mirror_orch]
    paths: [.github/candidate-ci-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: candle-1292-single-candidate-request
  cancel-in-progress: false
jobs:
  launch:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Attest merged fix, failed old GPU run and exact new candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req=.github/candidate-ci-request.json
          test -s "$req"
          foundation="$(gh api "repos/$GITHUB_REPOSITORY/pulls/12" --jq .merge_commit_sha)"
          fix="$(gh api "repos/$GITHUB_REPOSITORY/pulls/13" --jq .merge_commit_sha)"
          [[ "$foundation" =~ ^[0-9a-f]{40}$ && "$fix" =~ ^[0-9a-f]{40}$ ]] || exit 3
          jq -e --arg foundation "$foundation" --arg fix "$fix" '
            .schema_version==1 and .approved_pr==12 and
            .reviewed_gate_sha==$foundation and
            .fix_pr==13 and .fix_merge_sha==$fix and
            .candidate_sha==$fix and
            .auto_promote==false and
            .cuda_version=="12.9.2" and .ubuntu_version=="26.04" and
            .candidate_ref=="integration/cuda_asd_runner_v2-candidate" and
            .upstream_sha=="aebc405d2b4bf42808387e0ca597bf7dad9b565f" and
            .validation=="cpu_cuda" and .previous_gpu_run_id==36331103943 and
            (.campaign|test("^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$")) and
            .campaign!="integrated-sm61-1292-u2604-p0"
          ' "$req" >/dev/null || {
            echo "::error::Request does not match the reviewed MoE fix and isolated CUDA 12.9.2 campaign"; exit 3;
          }
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/integration/cuda_asd_runner_v2-candidate" --jq .commit.sha)"
          [[ "$actual" == "$fix" ]] || {
            echo "::error::Integrated candidate ref must equal PR13 merge commit"; exit 3;
          }
          old="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/36331103943")"
          jq -e '.status=="completed" and .conclusion=="failure"' <<< "$old" >/dev/null || {
            echo "::error::Old GPU run did not fail as expected"; exit 3;
          }
          campaign="$(jq -r .campaign "$req")"
          gh workflow run candle-candidate-ci.yml --repo "$GITHUB_REPOSITORY" --ref mirror_orch \
            -f branch=cuda_asd_runner_v2 \
            -f candidate_ref=integration/cuda_asd_runner_v2-candidate \
            -f "candidate_sha=$fix" \
            -f "campaign=$campaign" \
            -f upstream_sha=aebc405d2b4bf42808387e0ca597bf7dad9b565f \
            -f validation=cpu_cuda
          echo "Requested new MoE-corrected CPU/CUDA campaign $campaign at exact SHA $fix; auto-promotion disabled." >> "$GITHUB_STEP_SUMMARY"
