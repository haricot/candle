name: Capability Dispatch standalone S0
on:
  push:
    branches: [capability-dispatch-standalone]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capability-dispatch-${{ github.ref }}
  cancel-in-progress: false
  queue: max
env:
  RUSTFLAGS: -C target-cpu=x86-64
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
jobs:
  cpu:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Use the reviewed dependency resolution
        run: cp dispatch-standalone/Cargo.lock Cargo.lock
      - name: Check source scope and hashes
        run: python3 dispatch-standalone/verify_scope.py
      - name: Check core, NN facade and public consumer
        run: |
          cargo check --locked -p candle-core -p candle-nn --no-default-features
          cargo check --locked -p candle-core --no-default-features --example dispatch_bf16_linear
      - name: Execute dispatch and numerical contracts
        run: cargo test --locked -p candle-core --no-default-features --test dispatch_bf16
      - name: Execute the simple consumer
        run: cargo run --locked -p candle-core --no-default-features --example dispatch_bf16_linear
  cuda-compile:
    needs: cpu
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: ['61', '80']
    container:
      image: ghcr.io/haricot/mistral-ci-sm61@sha256:1ea7476aee23aed947918bb7159aaf82ae9f4e98caec19db1160768000354eee
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.cc }}
      NVCC_CCBIN: g++
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the reviewed dependency resolution
        run: cp dispatch-standalone/Cargo.lock Cargo.lock
      - name: Record the exact compiler environment
        run: |
          rustc -vV
          nvcc --version
          "$NVCC_CCBIN" --version
      - name: Compile core, facade, hardware contracts and consumer without a GPU
        run: |
          cargo check --locked -p candle-core -p candle-nn --no-default-features --features cuda
          cargo test --locked -p candle-core --no-default-features --features cuda --test dispatch_bf16 --no-run
          cargo build --locked -p candle-core --no-default-features --features cuda --example dispatch_bf16_linear
      - name: Verify generated dispatch entry points without a GPU
        run: python3 dispatch-standalone/verify_ptx.py target
