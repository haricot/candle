name: HDB2-C2 standalone CPU qualification
on:
  push:
    branches: [hdb2c2_cpu_standalone]
    paths:
      - .github/workflows/hdb2c2-cpu-standalone.yml
      - tools/hdb2c2-standalone/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hdb2c2-cpu-standalone
  cancel-in-progress: false
jobs:
  source-detection:
    name: Detect verified standalone source archive
    runs-on: ubuntu-24.04
    outputs:
      bundle_present: ${{ steps.check.outputs.bundle_present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          bash -n tools/hdb2c2-standalone/ci_cpu.sh
          if test -f tools/hdb2c2-standalone/haricot-half-duplex-hdb2c-c2-standalone-v0.6.6.zip; then
            echo 'bundle_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bundle_present=false' >> "$GITHUB_OUTPUT"
            echo 'C2 full qualification NOT RUN: source ZIP not yet stored on branch.'
          fi
  cameo-dataset-smoke:
    name: French CAMEO corpus contract (no private recordings)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset reader only
        run: python -m pip install 'datasets==3.6.0' 'soundfile' 'numpy'
      - name: Validate offline selection rules
        run: python -m unittest discover -s tools/hdb2c2-standalone -p 'test_cameo_subset.py' -v
      - name: Verify real French CAMEO audio and transcript coverage
        run: |
          python tools/hdb2c2-standalone/cameo_subset.py --out "$RUNNER_TEMP/cameo" --per-emotion 1
          python - "$RUNNER_TEMP/cameo/manifest.json" <<'PY'
          import json,sys,pathlib
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          rows=m['rows']
          assert len(rows)==14,len(rows)
          assert {x['split'] for x in rows}=={'cafe','oreau'}
          assert all(pathlib.Path(x['wav']).is_file() and pathlib.Path(x['reference_file']).is_file() for x in rows)
          print('HDB2C2_DATASET=PASS_FRENCH_CAFE_OREAU_14_SAMPLES')
          print('HDB2C2_ASR_NUMERIC_PARITY=NOT_RUN')
          PY
  pinned-upstream-smoke:
    name: Pinned upstream CPU build (NOT C2 parity)
    needs: source-detection
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Compile and test pinned public Parakeet upstream
        run: bash tools/hdb2c2-standalone/ci_cpu.sh smoke
  full-cpu-parity:
    name: Real NeMo vs C2 CPU parity (requires source ZIP)
    needs: source-detection
    if: needs.source-detection.outputs.bundle_present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install required system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip libsndfile1-dev
      - name: Real public-audio numerical qualification
        run: bash tools/hdb2c2-standalone/ci_cpu.sh qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdb2c2-cpu-json-reports
          path: hdb2c2-ci-output/published/*.json
          if-no-files-found: warn
          retention-days: 14
