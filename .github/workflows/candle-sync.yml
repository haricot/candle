# Candle Sync — prepare and dispatch immutable candidate CI; GPU execution and promotion remain separate.
name: Candle Sync

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to prepare against upstream (or all branches)
        required: true
        type: choice
        default: all
        options:
          - all
          - bf16_candle
          - fp8_candle
          - fp4_candle
          - cudnn_fallback_candle
          - moe_simt_f16_candle
          - asd_core
      source_ref:
        description: Optional existing rebase/ or sync/ candidate; requires one selected branch
        required: false
        type: string
      upstream_sha:
        description: Optional pinned upstream SHA (empty uses latest upstream main)
        required: false
        type: string
      auto_fmt:
        description: Run rustfmt and commit formatting on temporary candidates before validation
        required: true
        type: boolean
        default: true
      validation:
        description: How to validate prepared candidates
        required: true
        type: choice
        default: cpu_cuda
        options:
          - cpu_cuda
          - cpu
          - prepare_only
      campaign:
        description: Optional unique campaign ID (letters, numbers, hyphens, underscores)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: candle-sync-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare candidate merges
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    outputs:
      campaign: ${{ steps.prepare.outputs.campaign }}
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the same rustfmt toolchain as Candidate CI
        if: inputs.auto_fmt
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Prepare from exact upstream and branch SHAs
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ inputs.branch }}
          CAMPAIGN_INPUT: ${{ inputs.campaign }}
          AUTO_FMT: ${{ inputs.auto_fmt }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PINNED_UPSTREAM_INPUT: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          umask 077
          report="${RUNNER_TEMP}/candle-sync-report"
          mkdir -p "${report}/logs" "${report}/conflicts" "${report}/format"
          results="${report}/branch-results.ndjson"
          : > "${results}"

          campaign="${CAMPAIGN_INPUT:-}"
          if [[ -z "${campaign}" ]]; then
            campaign="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "${campaign}" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$ ]]; then
            echo "::error::Invalid campaign ID. Use 1–40 ASCII letters/numbers/-/_; begin with a letter or number."
            exit 2
          fi
          echo "campaign=${campaign}" >> "${GITHUB_OUTPUT}"

          case "${SYNC_BRANCH}" in
            all)
              branches=(bf16_candle fp8_candle fp4_candle cudnn_fallback_candle moe_simt_f16_candle asd_core)
              ;;
            bf16_candle|fp8_candle|fp4_candle|cudnn_fallback_candle|moe_simt_f16_candle|asd_core)
              branches=("${SYNC_BRANCH}")
              ;;
            *)
              echo "::error::Unsupported branch selection"
              exit 2
              ;;
          esac

          if [[ -n "${SOURCE_REF}" ]]; then
            if [[ "${SYNC_BRANCH}" == "all" ||
                  ! "${SOURCE_REF}" =~ ^(rebase|sync)/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] ||
               ! git check-ref-format --branch "${SOURCE_REF}" >/dev/null 2>&1; then
              echo "::error::source_ref must be an existing rebase/ or sync/ branch with a single functional branch selected"
              exit 2
            fi
          fi

          # A fork main sync is intentionally unnecessary.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git remote add upstream https://github.com/huggingface/candle.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          upstream_tip="$(git rev-parse refs/remotes/upstream/main)"
          upstream_sha="${upstream_tip}"
          if [[ -n "${PINNED_UPSTREAM_INPUT}" ]]; then
            if [[ ! "${PINNED_UPSTREAM_INPUT}" =~ ^[0-9a-f]{40}$ ]] ||
               ! git cat-file -e "${PINNED_UPSTREAM_INPUT}^{commit}" ||
               ! git merge-base --is-ancestor "${PINNED_UPSTREAM_INPUT}" "${upstream_tip}"; then
              echo "::error::Pinned upstream SHA must be a full SHA reachable from upstream main"
              exit 2
            fi
            upstream_sha="${PINNED_UPSTREAM_INPUT}"
          fi
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"

          {
            echo "# Candle Sync — preparation"
            echo
            echo "- Campaign: ${campaign}"
            echo "- Upstream: huggingface/candle main @ ${upstream_sha}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Branch | Preparation | Candidate |"
            echo "| --- | --- | --- |"
          } > "${report}/report.md"

          # Every line is independently parseable JSON; no branch can block the
          # preparation of another branch.
          record() {
            local branch="$1" source="$2" status="$3" candidate="$4" sha="$5" detail="$6"
            local fmt_status="${7:-NOT_RUN}"
            jq -cn \
              --arg branch "${branch}" --arg source_sha "${source}" \
              --arg status "${status}" --arg candidate "${candidate}" \
              --arg candidate_sha "${sha}" --arg detail "${detail}" \
              --arg upstream_sha "${upstream_sha}" --arg fmt_status "${fmt_status}" \
              --arg source_ref "${source_ref:-$branch}" \
              '{branch:$branch,
                source_sha:(if $source_sha=="" then null else $source_sha end),
                upstream_sha:$upstream_sha,
                status:$status,format_status:$fmt_status,source_ref:$source_ref,
                candidate:(if $candidate=="" then null else $candidate end),
                candidate_sha:(if $candidate_sha=="" then null else $candidate_sha end),
                detail:$detail}' >> "${results}"
            if [[ -n "${sha}" ]]; then
              echo "| ${branch} | ${status} | [${candidate}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${candidate}) |" >> "${report}/report.md"
            else
              echo "| ${branch} | ${status} | — |" >> "${report}/report.md"
            fi
          }

          for branch in "${branches[@]}"; do
            echo "::group::Prepare ${branch}"
            candidate="sync/${campaign}/${branch}"
            log="${report}/logs/${branch}.log"
            source_ref="${SOURCE_REF:-$branch}"

            if ! git fetch --no-tags origin \
              "+refs/heads/${source_ref}:refs/remotes/origin/candle-selected-source" >"${log}" 2>&1; then
              record "${branch}" "" "MISSING_BRANCH" "" "" "Unable to fetch the source branch"
              echo "::endgroup::"
              continue
            fi
            source_sha="$(git rev-parse refs/remotes/origin/candle-selected-source)"

            # Never overwrite a previously published candidate.
            if git ls-remote --exit-code --heads origin "refs/heads/${candidate}" > /dev/null 2>&1; then
              record "${branch}" "${source_sha}" "STALE" "" "" "Candidate ref already exists; use a new campaign ID"
              echo "::endgroup::"
              continue
            fi

            git switch --detach -f "${source_sha}" >>"${log}" 2>&1
            if ! git merge --no-ff --no-edit "${upstream_sha}" >>"${log}" 2>&1; then
              mkdir -p "${report}/conflicts/${branch}"
              git ls-files -u > "${report}/conflicts/${branch}/index-stages.txt"
              git diff --name-only --diff-filter=U > "${report}/conflicts/${branch}/files.txt"
              if [[ -s "${report}/conflicts/${branch}/files.txt" ]]; then
                while IFS= read -r -d '' path; do
                  for stage in 1 2 3; do
                    output="${report}/conflicts/${branch}/stage-${stage}/${path}"
                    mkdir -p "$(dirname "${output}")"
                    git show ":${stage}:${path}" > "${output}" 2>/dev/null || rm -f "${output}"
                  done
                done < <(git diff --name-only --diff-filter=U -z)
                status="CONFLICT"
              else
                status="MERGE_FAILED"
              fi
              git merge --abort >>"${log}" 2>&1 || git reset --hard "${source_sha}" >>"${log}" 2>&1
              record "${branch}" "${source_sha}" "${status}" "" "" "See logs and conflict artifacts"
              echo "::endgroup::"
              continue
            fi

            fmt_status=SKIPPED
            if [[ "${AUTO_FMT}" == "true" ]]; then
              fmt_dir="${report}/format/${branch}"
              mkdir -p "${fmt_dir}"
              # Only Rust files changed by this candidate relative to the
              # recorded upstream SHA are eligible for automatic formatting.
              git diff --name-only -z "${upstream_sha}" HEAD -- '*.rs' > "${fmt_dir}/allowlist.nul"
              declare -A fmt_allowed=()
              while IFS= read -r -d '' path; do
                fmt_allowed["${path}"]=1
              done < "${fmt_dir}/allowlist.nul"

              rustfmt --version > "${fmt_dir}/rustfmt-version.txt"
              fmt_status=UNCHANGED
              if ! cargo fmt --all > "${fmt_dir}/cargo-fmt.log" 2>&1; then
                fmt_status=FMT_FAILED
              else
                : > "${fmt_dir}/changed-files.txt"
                : > "${fmt_dir}/out-of-scope.txt"
                while IFS= read -r -d '' path; do
                  printf '%s\n' "${path}" >> "${fmt_dir}/changed-files.txt"
                  if [[ "${path}" != *.rs || -z "${fmt_allowed[$path]+yes}" ]]; then
                    printf '%s\n' "${path}" >> "${fmt_dir}/out-of-scope.txt"
                  fi
                done < <(git diff --name-only -z)
                git ls-files --others --exclude-standard > "${fmt_dir}/untracked.txt"
                if [[ -s "${fmt_dir}/out-of-scope.txt" || -s "${fmt_dir}/untracked.txt" ]]; then
                  fmt_status=FMT_SCOPE_VIOLATION
                elif ! git diff --check > "${fmt_dir}/diff-check.log" 2>&1; then
                  fmt_status=FMT_FAILED
                elif ! cargo fmt --all -- --check > "${fmt_dir}/fmt-check.log" 2>&1; then
                  fmt_status=FMT_FAILED
                elif [[ -s "${fmt_dir}/changed-files.txt" ]]; then
                  git add -u
                  if git commit -m "style(sync): rustfmt temporary candidate ${branch}" >> "${log}" 2>&1; then
                    fmt_status=AUTO_FORMATTED
                  else
                    fmt_status=FMT_FAILED
                  fi
                fi
              fi
              unset fmt_allowed
              printf '%s\n' "${fmt_status}" > "${fmt_dir}/status.txt"
              if [[ "${fmt_status}" == FMT_FAILED || "${fmt_status}" == FMT_SCOPE_VIOLATION ]]; then
                git diff > "${fmt_dir}/uncommitted.patch" || true
                record "${branch}" "${source_sha}" "${fmt_status}" "" "" \
                  "Formatting failed or changed files outside the feature delta; see format evidence" "${fmt_status}"
                echo "::error::Formatting blocked ${branch}: ${fmt_status}; see report/format/${branch}"
                echo "::endgroup::"
                continue
              fi
            fi

            candidate_sha="$(git rev-parse HEAD)"
            if [[ "${candidate_sha}" == "${source_sha}" && -n "${SOURCE_REF}" ]]; then
              # The already-rebased source is unchanged by merge/format.
              # Validate its exact SHA directly; do not create a redundant sync ref.
              record "${branch}" "${source_sha}" "REUSED_SOURCE" "${SOURCE_REF}" "${source_sha}" \
                "No code or rustfmt changes; validate the existing candidate ref" "${fmt_status}"
              echo "::endgroup::"
              continue
            fi
            if [[ "${candidate_sha}" == "${source_sha}" && -z "${SOURCE_REF}" ]]; then
              record "${branch}" "${source_sha}" "UP_TO_DATE" "" "" "Source already contains the recorded upstream SHA" "${fmt_status}"
              echo "::endgroup::"
              continue
            fi

            # The push creates a new ref only; it never updates a public feature branch.
            if git push origin "${candidate_sha}:refs/heads/${candidate}" >>"${log}" 2>&1; then
              record "${branch}" "${source_sha}" "CHECKS_PENDING" "${candidate}" "${candidate_sha}" "Candidate published for independent read-only CI" "${fmt_status}"
            else
              record "${branch}" "${source_sha}" "PUSH_FAILED" "" "" "See branch log"
            fi
            echo "::endgroup::"
          done

          jq -s \
            --arg campaign "${campaign}" --arg upstream_sha "${upstream_sha}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schema_version:1,campaign:$campaign,upstream_sha:$upstream_sha,
              run_url:$run_url,branches:.}' "${results}" > "${report}/report.json"

          {
            cat "${report}/report.md"
            echo
            echo "Candidates are verified by Candle Candidate CI on exact commit SHAs."
            echo "CUDA compilation is not GPU execution. No public feature branch was modified."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Dispatch independent candidate CI on exact SHAs
        if: inputs.validation != 'prepare_only'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ steps.prepare.outputs.campaign }}
          VALIDATION_MODE: ${{ inputs.validation }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/candle-sync-report"
          : > "$report/dispatch.ndjson"
          : > "$report/dispatch.log"
          failures=0
          # Explicit workflow_dispatch works for GITHUB_TOKEN-created candidates,
          # unlike on:push. Do not start CI for conflicted branches.
          while read -r branch candidate sha upstream_sha; do
            [[ -n "$sha" ]] || continue
            if gh workflow run candle-candidate-ci.yml --repo "$GITHUB_REPOSITORY" --ref mirror_orch \
              -f "branch=$branch" -f "campaign=$CAMPAIGN" \
              -f "candidate_ref=$candidate" -f "candidate_sha=$sha" \
              -f "upstream_sha=$upstream_sha" -f "validation=$VALIDATION_MODE" \
              >> "$report/dispatch.log" 2>&1; then
              state=DISPATCHED
            else
              state=DISPATCH_FAILED
              failures=$((failures+1))
              echo "::error::Candidate CI dispatch failed for $branch ($sha)"
            fi
            jq -cn --arg branch "$branch" --arg candidate "$candidate" \
              --arg sha "$sha" --arg state "$state" --arg validation "$VALIDATION_MODE" \
              '{branch:$branch,candidate:$candidate,sha:$sha,status:$state,
                validation:$validation}' >> "$report/dispatch.ndjson"
            echo "$branch: $state ($sha)" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.branches[] | select(.candidate_sha != null) |
            [.branch,.candidate,.candidate_sha,.upstream_sha] | @tsv' "$report/report.json")
          echo "See Candle Candidate CI for the separate CPU/CUDA results." >> "$GITHUB_STEP_SUMMARY"
          ((failures == 0))

      - name: Upload preparation report and conflict evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 / Node 24
        with:
          name: candle-sync-preparation-${{ steps.prepare.outputs.campaign || github.run_id }}
          path: ${{ runner.temp }}/candle-sync-report/
          if-no-files-found: warn
          retention-days: 21

