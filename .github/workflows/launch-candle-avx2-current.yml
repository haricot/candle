name: Launch complete Candle AVX2 current campaigns
on:
  push:
    branches: [ci/launch-candle-avx2-20261103]
    paths: [.github/workflows/launch-candle-avx2-current.yml]
permissions:
  contents: read
concurrency:
  group: candle-avx2-current-launch
  cancel-in-progress: false
  queue: max
jobs:
  launch:
    if: github.repository == 'haricot/candle' && github.actor == 'haricot'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch complete immutable AVX2 campaigns without local GPU work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          targets=json.loads("[{\"ref\":\"orch/extended-v1\",\"sha\":\"8951bfc170b5b433b60ecbaf676a3708a1d553dc\",\"workflow\":\"candle-extended-composite.yml\",\"kind\":\"extended\"},{\"ref\":\"orch/legacy-cuda-v1\",\"sha\":\"290d5234a969acf658f4deeb04b6054e5e65e8c2\",\"workflow\":\"candle-legacy-cuda.yml\",\"kind\":\"legacy\"}]")
          repository="haricot/candle"
          def api(path):
              return json.loads(subprocess.check_output(["gh","api","repos/"+repository+"/"+path],text=True))
          base=api("git/ref/heads/main")["object"]["sha"]
          if base!="cfcbd7186d13271843ce7eb41d25659bd0835850":
              raise SystemExit("Main moved outside the reviewed compatibility migration")
          for target in targets:
              actual=api("branches/"+target["ref"])
              if actual["commit"]["sha"]!=target["sha"]:
                  raise SystemExit("Orchestrator moved; refuse a mutable dispatch")
              runs=api("actions/workflows/"+target["workflow"]+"/runs?per_page=100")
              matches=[r for r in runs["workflow_runs"] if r["head_sha"]==target["sha"] and r["event"]=="workflow_dispatch"]
              if matches:
                  all_preparations_failed=True
                  for existing in matches:
                      jobs=api("actions/runs/"+str(existing["id"])+"/jobs?filter=all&per_page=100")
                      prepare=[j for j in jobs["jobs"] if j["name"]=="prepare"]
                      if len(prepare)!=1 or prepare[0]["conclusion"]!="failure":
                          all_preparations_failed=False
                  if not all_preparations_failed:
                      print("ALREADY_DISPATCHED="+str(matches[0]["id"]),flush=True)
                      continue
              campaign=target["kind"]+"-avx2-"+os.environ["GITHUB_RUN_ID"]
              inputs={"campaign":campaign,"base_sha":"cfcbd7186d13271843ce7eb41d25659bd0835850","publish":"true","cpu_profile":"avx2"}
              if target["kind"]=="extended":
                  inputs["half_duplex_profile"]="auto"
              payload={"ref":target["ref"],"inputs":inputs}
              subprocess.run(["gh","api","--method","POST","repos/"+repository+"/actions/workflows/"+target["workflow"]+"/dispatches","--input","-"],input=json.dumps(payload),text=True,check=True)
              print("CANDLE_COMPLETE_DISPATCH="+target["kind"]+" candidate_recipe="+target["sha"]+" campaign="+campaign+" cpu_profile=avx2 base=cfcbd7186d13271843ce7eb41d25659bd0835850",flush=True)
          PY
