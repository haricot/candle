on:
  push:

name: Secret Leaks

permissions: {}

jobs:
  trufflehog:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b  # main
        with:
          # The first push of a new branch has an all-zero 'before' SHA.
          # Compare to the default branch instead of scanning all history.
          # Subsequent pushes still scan exactly the newly introduced commits.
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
          head: ${{ github.sha }}
