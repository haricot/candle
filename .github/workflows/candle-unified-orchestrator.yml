name: Candle Unified — Extended-Qualified Legacy and Standalone
# base-sync-main: c68b24997319b8d76e5a4e775dab197c7f26322a

on:
  # Explicit run trigger: a push commit with [run-unified] in its message.
  # Ordinary branch pushes run only the static contracts.
  push:
    branches: [orch/unified-candle-v1]
  workflow_dispatch:
    inputs:
      campaign:
        description: Immutable shared Legacy and Extended campaign
        type: string
        required: true
      base_sha:
        description: Optional exact fork main SHA; fail if main has moved
        type: string
        required: false
      publish:
        description: Publish temporary refs for CI (never stable refs)
        type: boolean
        required: true
        default: true
      promote:
        description: Atomically advance standalone, cuda_legacy and extended refs only after all gates pass
        type: boolean
        required: true
        default: false
      cpu_profile:
        description: 'One Rust CPU target for the shared CUDA-built archive'
        type: choice
        required: true
        default: avx2
        options: [portable, avx2]
      half_duplex_profile:
        description: Extended Half Duplex regression coverage
        type: choice
        required: true
        default: auto
        options: [auto, short, full, audit]

permissions:
  contents: read
  packages: read

concurrency:
  group: candle-unified-${{ github.event_name == 'push' && github.sha || inputs.campaign }}
  cancel-in-progress: false
  queue: max

jobs:
  validate_orchestrator:
    name: Static contracts (no Cargo, no CUDA)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B .github/scripts/candle-unified-pair-verify.py --selftest
      - run: python3 -B .github/scripts/candle-unified-retention-selftest.py
      - run: bash -n .github/scripts/candle-legacy-assemble.sh .github/scripts/candle-promote-validated.sh
      - run: python3 -B .github/scripts/legacy-main-selftest.py

  cuda_image:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.published == 'true'
    uses: ./.github/workflows/candle-cuda-ci-image.yml
    permissions:
      contents: read
      packages: write

  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-unified]')
    needs: validate_orchestrator
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.assemble.outputs.candidate_sha }}
      candidate_ref: ${{ steps.assemble.outputs.candidate_ref }}
      campaign: ${{ steps.assemble.outputs.campaign }}
      base_sha: ${{ steps.assemble.outputs.base_sha }}
      manifest_sha256: ${{ steps.assemble.outputs.manifest_sha256 }}
      matrix: ${{ steps.assemble.outputs.matrix }}
      published: ${{ steps.assemble.outputs.published }}
      has_lean: ${{ steps.assemble.outputs.has_lean }}
      legacy_candidate_sha: ${{ steps.assemble_legacy.outputs.candidate_sha }}
      legacy_candidate_ref: ${{ steps.assemble_legacy.outputs.candidate_ref }}
      has_half_duplex: ${{ steps.assemble.outputs.has_half_duplex }}
      half_duplex_profile: ${{ steps.assemble.outputs.half_duplex_profile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce and verify the reviewed upstream Legacy conflict resolution
        run: python3 -B .github/scripts/legacy-main-selftest.py
      - name: Verify release CPU target contracts
        run: python3 -B .github/scripts/candle-build-profile-selftest.py
      - name: Validate dynamic source contract before assembly
        run: bash .github/scripts/extended-dynamic-selftest.sh
      - name: Verify standalone rebase provenance and reviewed migrations
        run: python3 -B .github/scripts/candle-standalone-source-pin-selftest.py
      - name: Validate hosted executable archive and replay contracts
        run: python3 .github/scripts/extended-build-once-selftest.py
      - name: Verify the single native Candle Extended application contracts
        run: python3 -B .github/scripts/candle-extended-cli-selftest.py
      - name: Independently test CUDA link stub isolation for hosted CPU execution
        run: python3 .github/scripts/candle-cpu-cuda-link-stub-selftest.py
      - name: Prepare manifest-defined Extended candidate
        id: assemble
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ github.event_name == 'push' && format('extended-{0}-{1}', github.run_id, github.run_attempt) || inputs.campaign }}
          STRATEGY: exact-delta
          BASE_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || '' }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
          HALF_DUPLEX_PROFILE_REQUESTED: ${{ inputs.half_duplex_profile || 'auto' }}
        run: bash .github/scripts/candle-extended-assemble.sh
      - name: Prepare five-feature Legacy from the EXACT Extended prepared commits
        id: assemble_legacy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ steps.assemble.outputs.campaign }}
          STRATEGY: exact-delta
          BASE_SHA_INPUT: ${{ steps.assemble.outputs.base_sha }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
          REUSE_EXTENDED_MANIFEST: ${{ runner.temp }}/candle-extended/extended.json
        run: bash .github/scripts/candle-legacy-assemble.sh
      - name: Bind Legacy and Extended to identical five standalone preparations
        run: |
          python3 -B .github/scripts/candle-unified-pair-verify.py \
            --extended "$RUNNER_TEMP/candle-extended/extended.json" \
            --legacy "$RUNNER_TEMP/candle-legacy-cuda/legacy-cuda.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/candle-legacy-cuda/
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/candle-extended/
          if-no-files-found: warn
          retention-days: 30

  cpu_cuda_compile:
    needs: [prepare, cuda_image]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    outputs:
      hosted_manifest_sha256: ${{ steps.build_once.outputs.manifest_sha256 }}
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
      CHECK_BRANCH: extended_integration
      CHECK_CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
      CUDA_COMPUTE_CAP: '61'
      CARGO_INCREMENTAL: '0'
      CANDLE_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
      CANDLE_CPU_PROFILE: ${{ inputs.cpu_profile || 'avx2' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cuda_cache
        with:
          path: |
            ${{ runner.temp }}/cuda-cargo
            target
          key: candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-${{ env.CANDLE_CPU_PROFILE }}-${{ needs.prepare.outputs.base_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-${{ env.CANDLE_CPU_PROFILE }}-${{ needs.prepare.outputs.base_sha }}-
            candle-sm61-${{ needs.cuda_image.outputs.environment_key }}-${{ env.CANDLE_CPU_PROFILE }}-
      - name: Free unused hosted SDKs before extracting CUDA
        env:
          HARICOT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .ci-tools/.github/scripts/free-hosted-disk.sh
      - name: Pull the verified immutable CUDA environment
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CANDLE_CUDA_IMAGE"
      - shell: bash
        id: build_once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuda-home" "$RUNNER_TEMP/cuda-cargo"
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:rw" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/cuda-home" \
            --env "CARGO_HOME=$RUNNER_TEMP/cuda-cargo" \
            --env RUSTUP_HOME=/opt/rustup \
            --env CUDA_COMPUTE_CAP --env CARGO_INCREMENTAL --env CANDLE_CUDA_IMAGE --env CANDLE_CPU_PROFILE \
            --env GITHUB_WORKSPACE --env RUNNER_TEMP --env GITHUB_STEP_SUMMARY \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env CANDIDATE_SHA --env CANDIDATE_REF --env CHECK_BRANCH \
            --env CHECK_CAMPAIGN --env LOCK_SHA256 \
            "$CANDLE_CUDA_IMAGE" \
            bash -c '
              set -euo pipefail
              # The composed candidate intentionally has no tracked Cargo.lock.
              # Resolve it once here and bind both CPU and GPU to these bytes.
              cargo generate-lockfile
              mkdir -p "$RUNNER_TEMP/candidate-cpu-proof"
              cp Cargo.lock "$RUNNER_TEMP/candidate-cpu-proof/Cargo.lock"
              LOCK_SHA256="$(sha256sum Cargo.lock | cut -d" " -f1)"
              export LOCK_SHA256
              # One explicit CPU/profile selection for the precheck and binaries.
              # Override target-cpu=native from the candidate workspace too.
              RUSTFLAGS="$(python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-extended-build-once.py" cpu-rustflags)"
              export RUSTFLAGS CANDLE_CUDA_BUILD_PROFILE=release
              bash "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-candidate-cuda-compile.sh"
              python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-extended-build-once.py" \
                build --out "$RUNNER_TEMP/extended-sm61-build-once"
            '
          echo "manifest_sha256=$(sha256sum "$RUNNER_TEMP/extended-sm61-build-once/manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cuda_cache.outputs.cache-primary-key != ''
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/cuda-cargo
            target
          key: ${{ steps.cuda_cache.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-cuda-compile
          path: ${{ runner.temp }}/candle-candidate-cuda/
          if-no-files-found: warn
          retention-days: 30
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-build-once
          path: ${{ runner.temp }}/extended-sm61-build-once/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  cpu_execute:
    name: CPU Execute — CUDA-built artifacts
    needs: [prepare, cpu_cuda_compile, cuda_image]
    if: needs.cpu_cuda_compile.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CUDA_COMPUTE_CAP: '61'
      CARGO_INCREMENTAL: '0'
      EXTENDED_BUILD_ONCE_MANIFEST_SHA256: ${{ needs.cpu_cuda_compile.outputs.hosted_manifest_sha256 }}
      CANDLE_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-build-once
          path: ${{ runner.temp }}/extended-sm61-build-once
      - name: Free unused hosted SDKs before extracting CUDA
        env:
          HARICOT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .ci-tools/.github/scripts/free-hosted-disk.sh
      - name: Pull the verified immutable CUDA environment
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CANDLE_CUDA_IMAGE"
      - name: Execute CPU model contracts from the verified CUDA archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cuda-home" "$RUNNER_TEMP/extended-cpu-execute"
          docker run --rm --user "$(id -u):$(id -g)" --security-opt=no-new-privileges \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "HOME=$RUNNER_TEMP/cuda-home" \
            --env RUSTUP_HOME=/opt/rustup \
            --env CUDA_COMPUTE_CAP --env CANDIDATE_SHA --env CANDLE_CUDA_IMAGE \
            --env GITHUB_WORKSPACE --env RUNNER_TEMP \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env EXTENDED_BUILD_ONCE_MANIFEST_SHA256 \
            "$CANDLE_CUDA_IMAGE" \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-cpu-cuda-link-stub.py" \
                -- python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-extended-build-once.py" \
                cpu-qualify --bundle "$RUNNER_TEMP/extended-sm61-build-once" \
                --report "$RUNNER_TEMP/extended-cpu-execute"
              python3 "$GITHUB_WORKSPACE/.ci-tools/.github/scripts/candle-extended-build-once.py" \
                export-release --bundle "$RUNNER_TEMP/extended-sm61-build-once" \
                --out "$RUNNER_TEMP/candle-extended-release"
            '
      - name: Upload ONE Candle Extended release executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candle-extended-${{ needs.prepare.outputs.campaign }}-${{ inputs.cpu_profile || 'avx2' }}
          path: ${{ runner.temp }}/candle-extended-release/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-cpu-execute
          path: ${{ runner.temp }}/extended-cpu-execute/
          if-no-files-found: warn
          retention-days: 30

  physical_sm61:
    name: SM61 Extended runtime
    needs: [prepare, cpu_cuda_compile, cpu_execute, cuda_image]
    if: needs.cpu_execute.result == 'success'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - cuda
      - sm61
      - candle-extended
      - extended-${{ github.run_id }}
    timeout-minutes: 240
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CUDA_COMPUTE_CAP: '61'
      NVCC: /opt/cuda/bin/nvcc
      NVCC_CCBIN: gcc-14
      CARGO_INCREMENTAL: '0'
      CANDLE_CUDA_IMAGE: ${{ needs.cuda_image.outputs.image }}
      CANDLE_BUILD_ONCE_EXECUTOR: physical-sm61
      CANDLE_ASD_HOME: /run/haricot/asd
      CANDLE_ASD_MODULE_DIR: /run/haricot/asd/artifacts/sm61
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-build-once
          path: ${{ runner.temp }}/extended-sm61-build-once
      - name: Validate Extended composition on physical SM61
        shell: bash
        env:
          CANDLE_EXTENDED_BUILD_ONCE_DIR: ${{ runner.temp }}/extended-sm61-build-once
          EXTENDED_BUILD_ONCE_MANIFEST_SHA256: ${{ needs.cpu_cuda_compile.outputs.hosted_manifest_sha256 }}
        run: bash .ci-tools/.github/scripts/candle-extended-sm61.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-sm61
          path: ${{ runner.temp }}/extended-sm61-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve native GPU Half Duplex regression or requested FP64 evidence
        if: always() && needs.prepare.outputs.has_half_duplex == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-half-duplex-gpu
          path: halfduplex-ci-published/*.json
          if-no-files-found: warn
          retention-days: 30

  promote_validated:
    name: Promote Extended-qualified Legacy, Extended and standalone refs
    needs: [prepare, cpu_execute, physical_sm61]
    if: needs.cpu_execute.result == 'success' && needs.physical_sm61.result == 'success' && needs.prepare.outputs.published == 'true' && inputs.promote == true
    concurrency:
      group: candle-unified-stable-ref-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
      LEGACY_CANDIDATE_SHA: ${{ needs.prepare.outputs.legacy_candidate_sha }}
      LEGACY_CANDIDATE_REF: ${{ needs.prepare.outputs.legacy_candidate_ref }}
      CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      TARGET_BRANCH: extended
      MANIFEST_PATH: candle-integration/extended.json
      PROMOTION_KIND: extended
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive and atomically promote validated refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/candle-promote-validated.sh
      - name: R3 — keep one previous state and prune verified temporary refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/scripts/candle-unified-retention.py \
            --report-dir "$RUNNER_TEMP/candle-promotion" --apply
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-${{ needs.prepare.outputs.campaign }}-promotion
          path: ${{ runner.temp }}/candle-promotion/
          if-no-files-found: warn
          retention-days: 30

