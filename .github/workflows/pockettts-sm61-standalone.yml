name: PocketTTS SM61 standalone CPU operator gate

on:
  push:
    branches:
      - pockettts_sm61_standalone
    paths:
      - "candle-examples/examples/pockettts-sm61/**"
      - ".github/workflows/pockettts-sm61-standalone.yml"
      - "candle-examples/Cargo.toml"
      - "candle-core/**"
      - "candle-nn/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pockettts-sm61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-a0:
    name: A0 deterministic CPU operators
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CPU operator unit gate
        run: cargo test -p candle-examples --example pockettts-sm61 -- --nocapture
      - name: CPU operator CLI gate
        run: cargo run -p candle-examples --example pockettts-sm61 -- --device cpu
