name: Candle Post-Validation Historical Cleanup
# One-shot: push of this exact workflow into mirror_orch. PR #26 is not merged.
on:
  push:
    branches:
      - mirror_orch
    paths:
      - .github/workflows/candle-post-validation-prune.yml

permissions:
  contents: read

concurrency:
  group: candle-historical-prune-20261016
  cancel-in-progress: false

jobs:
  archive_and_prune:
    if: >-
      github.repository == 'haricot/candle' &&
      github.ref == 'refs/heads/mirror_orch' &&
      github.event.head_commit.message == 'ci: execute audited SM61 cleanup, fix workflow validation'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable cleanup campaign
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate cleanup bash syntax
        run: bash -n .github/scripts/candle-post-validation-prune.sh
      - name: Verify original SM61 proofs and preview all 99 references
        env:
          PRUNE_DRY_RUN: 'true'
        run: bash .github/scripts/candle-post-validation-prune.sh
      - name: Archive immutable commits and prune historical branch refs
        env:
          PRUNE_DRY_RUN: 'false'
          PRUNE_CONFIRM: ARCHIVE_AND_DELETE_99
        run: bash .github/scripts/candle-post-validation-prune.sh
      - name: Upload cleanup audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-sm61-historical-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candle-prune/
          if-no-files-found: warn
          retention-days: 90
