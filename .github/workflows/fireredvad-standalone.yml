name: FireRedVAD standalone model contracts
on:
  push:
    branches: [fireredvad_standalone]
    paths:
      - 'Cargo.toml'
      - 'candle-transformers/**'
      - '.github/workflows/fireredvad-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Verify model format
        run: rustfmt --edition 2021 --check candle-transformers/src/models/fireredvad.rs candle-transformers/src/models/fireredvad/audio.rs
      - name: FireRedVAD model and feature contracts
        run: cargo test --locked -p candle-transformers --lib models::fireredvad -- --nocapture
