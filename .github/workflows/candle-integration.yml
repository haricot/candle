name: Candle Integration
# Exactly one combined CPU/CUDA validation candidate; no per-feature GPU campaigns.
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: One identifier for this six-feature integration
        type: string
        required: true
        default: integrated-sm61-v2
permissions:
  contents: read
concurrency:
  group: candle-single-integration
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/mirror_orch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.combine.outputs.sha }}
      campaign: ${{ steps.combine.outputs.campaign }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 Node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt
      - name: Restore prior verified rerere resolutions for the pinned six-source set
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5 Node24
        with:
          path: .git/rr-cache
          key: candle-rerere-v1-${{ runner.os }}-${{ hashFiles('.github/candle-integration-sources.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candle-rerere-v1-${{ runner.os }}-${{ hashFiles('.github/candle-integration-sources.json') }}-
      - name: Combine exact pinned source commits into one integrated candidate
        id: combine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          set -euo pipefail
          umask 077
          report="${RUNNER_TEMP}/candle-integration"
          mkdir -p "${report}/conflicts" "${report}/logs"
          [[ "${CAMPAIGN}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$ ]] || exit 2
          echo "campaign=${CAMPAIGN}" >> "${GITHUB_OUTPUT}"

          target="integration/cuda_asd_runner_v2-candidate"
          source_cfg=".github/candle-integration-sources.json"
          test -s "${source_cfg}" || { echo "::error::Pinned six-source config missing"; exit 3; }
          jq -e '
            .schema_version==1
            and .upstream_sha=="aebc405d2b4bf42808387e0ca597bf7dad9b565f"
            and .baseline_sha=="23cd66e38694c54c2184a57ba9f2c25a7ba1c682"
            and ([.sources[].feature]|sort)==
              (["bf16_candle","fp8_candle","fp4_candle",
                "cudnn_fallback_candle","moe_simt_f16_candle","asd_core"]|sort)
            and all(.sources[]; (.source_sha|test("^[0-9a-f]{40}$")))
          ' "${source_cfg}" > /dev/null || {
            echo "::error::Six-source config is invalid or does not match the locked baseline"; exit 3;
          }
          upstream="$(jq -r .upstream_sha "${source_cfg}")"
          baseline="$(jq -r .baseline_sha "${source_cfg}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Exact repeated conflict preimages may reuse previous reviewed
          # resolutions, but do not autostage unreviewed or novel conflicts.
          git config rerere.enabled true
          git config rerere.autoupdate false
          mkdir -p .git/rr-cache
          echo "rerere.enabled=$(git config rerere.enabled)" > "${report}/logs/rerere-configuration.txt"
          echo "rerere.autoupdate=$(git config rerere.autoupdate)" >> "${report}/logs/rerere-configuration.txt"
          gh auth setup-git
          git remote add upstream https://github.com/huggingface/candle.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags origin \
            +refs/heads/compat/sm61-cuda-baseline-aebc405d:refs/remotes/origin/candle-integration-baseline
          [[ "$(git rev-parse refs/remotes/origin/candle-integration-baseline)" == "${baseline}" ]] || {
            echo "::error::Shared SM61 baseline has changed; refuse integration"; exit 3;
          }
          git merge-base --is-ancestor "${upstream}" "${baseline}" || exit 3
          git merge-base --is-ancestor "${upstream}" refs/remotes/upstream/main || exit 3

          # Source-ref list and rerere cache namespace both derive from the
          # same committed configuration, avoiding stale conflict training.
          mapfile -t sources < <(jq -r '.sources[] |
            [.feature,.source_ref,.source_sha] | join("|")' "${source_cfg}")
          [[ "${#sources[@]}" -eq 6 ]] || exit 3
          : > "${report}/sources.ndjson"
          # Resolve each exact source before modifying any refs.
          for item in "${sources[@]}"; do
            IFS='|' read -r feature ref expected <<< "${item}"
            git check-ref-format --branch "${ref}" || exit 3
            git fetch --no-tags origin "+refs/heads/${ref}:refs/remotes/origin/candle-integration-source"
            actual="$(git rev-parse refs/remotes/origin/candle-integration-source)"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${feature} source advanced from ${expected} to ${actual}"; exit 3;
            }
            jq -cn --arg feature "${feature}" --arg ref "${ref}" --arg sha "${expected}" \
              '{feature:$feature,source_ref:$ref,source_sha:$sha}' \
              >> "${report}/sources.ndjson"
          done
          jq -s --arg baseline "${baseline}" --arg upstream "${upstream}" \
            '{schema_version:1,baseline_sha:$baseline,upstream_sha:$upstream,sources:.}' \
            "${report}/sources.ndjson" > "${report}/sources.json"

          current="$(git ls-remote --heads origin "refs/heads/${target}" | cut -f1)"
          if [[ -n "${current}" && "${current}" != "${baseline}" ]]; then
            # An existing integrated candidate can be validated, but may
            # not be silently overwritten after earlier CI.
            git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/integration-existing"
            git switch --detach -f "${current}"
            test -f candle-integration/sources.json || {
              echo "::error::Existing integration SHA has no source manifest"; exit 3;
            }
            cmp -s "${report}/sources.json" candle-integration/sources.json || {
              echo "::error::Existing integration source pins differ"; exit 3;
            }
            while read -r feature sha; do
              git merge-base --is-ancestor "${sha}" HEAD || {
                echo "::error::Existing integration lacks ${feature} ${sha}"; exit 3;
              }
            done < <(jq -r '.sources[] | [.feature,.source_sha] | @tsv' "${report}/sources.json")
            cargo fmt --all -- --check > "${report}/format-check.log" 2>&1 || {
              echo "::error::Existing candidate requires explicit format repair"; exit 3;
            }
            echo "Reusing previously prepared combined source SHA ${current}" >> "${GITHUB_STEP_SUMMARY}"
            echo "sha=${current}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git switch --detach -f "${baseline}"
          for item in "${sources[@]}"; do
            IFS='|' read -r feature ref expected <<< "${item}"
            echo "::group::Merge ${feature} exact ${expected}"
            git fetch --no-tags origin "+refs/heads/${ref}:refs/remotes/origin/candle-integration-source"
            [[ "$(git rev-parse refs/remotes/origin/candle-integration-source)" == "${expected}" ]] || exit 3
            if ! git merge --no-ff --no-edit -m "integrate(${feature}): merge exact pinned source ${expected}" \
              "${expected}" > "${report}/logs/${feature}.log" 2>&1; then
              # "rerere" has already tried any matching learned preimage.
              # With autoupdate=false, only explicitly identified replayed
              # paths are staged. All novel or ambiguous conflicts fail closed.
              git rerere >> "${report}/logs/${feature}.log" 2>&1 || :
              mkdir -p "${report}/conflicts/${feature}"
              git rerere status > "${report}/conflicts/${feature}/rerere-status.txt" 2>&1 || :
              git rerere diff > "${report}/conflicts/${feature}/rerere-diff.patch" 2>&1 || :
              git rerere remaining > "${report}/conflicts/${feature}/rerere-unresolved.txt" 2>&1 || :
              mapfile -t still_conflicted < "${report}/conflicts/${feature}/rerere-unresolved.txt"
              mapfile -t conflicted_paths < <(git diff --name-only --diff-filter=U)
              : > "${report}/conflicts/${feature}/rerere-replayed.txt"
              for path in "${conflicted_paths[@]}"; do
                unresolved=false
                for outstanding in "${still_conflicted[@]}"; do
                  [[ "${path}" != "${outstanding}" ]] || unresolved=true
                done
                if [[ "${unresolved}" == false ]]; then
                  # rerere recognized the exact conflict and wrote its
                  # existing resolution in the working tree; stage it only
                  # after checking markers and whitespace.
                  if grep -Eq '^(<<<<<<< |=======|>>>>>>> )' -- "${path}" 2>/dev/null; then
                    echo "Replay contains conflict markers: ${path}" >> "${report}/conflicts/${feature}/rerere-rejected.txt"
                    continue
                  fi
                  git add -- "${path}"
                  printf '%s\n' "${path}" >> "${report}/conflicts/${feature}/rerere-replayed.txt"
                fi
              done
              git ls-files -u > "${report}/conflicts/${feature}/index-stages.txt"
              git diff --name-only --diff-filter=U > "${report}/conflicts/${feature}/files.txt"
              git status --short > "${report}/conflicts/${feature}/status.txt"
              if [[ -s "${report}/conflicts/${feature}/index-stages.txt" ]] || \
                 ! git diff --cached --check > "${report}/conflicts/${feature}/diff-check.log" 2>&1; then
                git diff -- > "${report}/conflicts/${feature}/merged-conflict.patch" || :
                echo "::error::Unlearned or unsafe conflict in ${feature}; no candidate published"
                tail -n 45 "${report}/logs/${feature}.log"
                exit 3
              fi
              # Every unmerged file was resolved by an exact cached
              # resolution; Git recorded the final working tree in the index.
              git commit --no-edit -m "integrate(${feature}): rerere replay of verified resolution" \
                >> "${report}/logs/${feature}.log" 2>&1
              echo "Successfully replayed cached rerere for ${feature}" \
                >> "${GITHUB_STEP_SUMMARY}"
            fi
            echo "::endgroup::"
          done

          mkdir -p candle-integration
          cp "${report}/sources.json" candle-integration/sources.json
          # Source manifest is data-only: public Git SHAs, no runner/user paths.
          cargo fmt --all > "${report}/fmt.log" 2>&1
          git diff --check > "${report}/diff-check.log" 2>&1
          if [[ -n "$(git diff --name-only -- . ':!*.rs')" ]]; then
            echo "::error::Formatter changed unexpected non-Rust paths"; exit 3
          fi
          git add -u -- '*.rs'
          git add candle-integration/sources.json
          if ! git diff --cached --quiet; then
            git commit -m "integrate: lock six source SHAs and rustfmt final combination"
          fi
          cargo fmt --all -- --check > "${report}/format-check.log" 2>&1
          while read -r feature sha; do
            git merge-base --is-ancestor "${sha}" HEAD || exit 3
          done < <(jq -r '.sources[] | [.feature,.source_sha] | @tsv' candle-integration/sources.json)
          sha="$(git rev-parse HEAD)"
          if [[ -n "${current}" ]]; then
            git push --force-with-lease="refs/heads/${target}:${baseline}" \
              origin "${sha}:refs/heads/${target}"
          else
            git push origin "${sha}:refs/heads/${target}"
          fi
          actual="$(git ls-remote --heads origin "refs/heads/${target}" | cut -f1)"
          [[ "${actual}" == "${sha}" ]] || {
            echo "::error::Integrated candidate ref did not match pushed SHA"; exit 3;
          }
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "One six-feature integrated candidate: ${target} @ ${sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve integration manifest and conflicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 Node24
        with:
          name: candle-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/candle-integration/
          if-no-files-found: warn
          retention-days: 90
      - name: Persist learned rerere resolutions for identical pinned sources
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5 Node24
        with:
          path: .git/rr-cache
          key: candle-rerere-v1-${{ runner.os }}-${{ hashFiles('.github/candle-integration-sources.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  dispatch_cpu_cuda:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch exactly ONE combined Candidate CI on final immutable SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          CAMPAIGN: ${{ needs.prepare.outputs.campaign }}
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          gh workflow run candle-candidate-ci.yml --repo "${GITHUB_REPOSITORY}" --ref mirror_orch \
            -f branch=cuda_asd_runner_v2 \
            -f candidate_ref=integration/cuda_asd_runner_v2-candidate \
            -f "candidate_sha=${SHA}" -f "campaign=${CAMPAIGN}" \
            -f upstream_sha=aebc405d2b4bf42808387e0ca597bf7dad9b565f \
            -f validation=cpu_cuda
          echo "Integrated CPU+CUDA validation dispatched for ${SHA}" >> "${GITHUB_STEP_SUMMARY}"
