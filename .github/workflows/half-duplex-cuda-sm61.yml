name: Half Duplex CUDA sm61 candidate
on:
  push:
    branches: [half_duplex]
    paths:
      - '.github/workflows/half-duplex-cuda-sm61.yml'
      - 'half_duplex/**'
  workflow_dispatch:
    inputs:
      run_cuda:
        description: 'Explicitly run on a trusted, configured sm61 NVIDIA runner'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cuda-cudnn-sm61:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_cuda) || contains(github.event.head_commit.message, '[cuda-sm61]') }}
    runs-on: [self-hosted, linux, x64, cuda, sm61]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify hardware and required model/environment
        shell: bash
        run: |
          set -euo pipefail
          command -v nvcc
          command -v nvidia-smi
          nvidia-smi -L
          compute="$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader -i 0 | tr -d '[:space:]')"
          test "$compute" = "6.1" || { echo "SM61_REQUIRED_FOUND=$compute" >&2; exit 3; }
          : "${HDB2A_RUNTIME_DIR:?must set existing pinned runtime directory}"
          : "${HDB2A_MODEL_DIR:?must set existing converted checkpoint directory}"
          : "${HDB2C_PYTHON:?must set existing isolated Python 3.13 venv path}"
          echo 'HALF_DUPLEX_CUDA_TARGET=sm61'
      - name: Build and test isolated Candle CUDA cuDNN candidate (no promotion)
        working-directory: half_duplex
        run: ./install_update.sh --cuda-cudnn
