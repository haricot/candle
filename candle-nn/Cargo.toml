[package]
name = "candle-nn"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
candle = { workspace = true }
candle-kernels = { workspace = true, optional = true, features = ["cutile"] }
half = { workspace = true }
thiserror = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
num-traits = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
objc2-metal = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
libc = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[features]
default = []
accelerate = ["dep:accelerate-src", "candle/accelerate"]
cuda = ["candle/cuda"]
cuda-dkr-catalog = ["cuda", "candle/cuda-dkr-catalog"]
cuda-dkr-embedded = ["cuda-dkr-catalog", "candle/cuda-dkr-embedded"]
cuda-dkr-cubin-embedded = ["cuda-dkr-embedded", "candle/cuda-dkr-cubin-embedded"]
cuda-dkr-neutral-mmq = ["cuda-dkr-embedded", "candle/cuda-dkr-neutral-mmq"]
cuda-dkr-neutral-recipes = ["cuda-dkr-neutral-mmq", "candle/cuda-dkr-neutral-recipes"]
cuda-dkr-cudaforge-catalog = ["cuda-dkr-neutral-recipes", "cuda-dkr-cubin-embedded", "candle/cuda-dkr-cudaforge-catalog"]
cuda-dkr-qualified-default = ["cuda-dkr-cudaforge-catalog", "candle/cuda-dkr-qualified-default"]
cuda-dkr-s31 = ["cuda-dkr-catalog", "candle/cuda-dkr-s31"]
cutile = ["cuda", "candle/cutile", "dep:candle-kernels"]
cudnn = ["candle/cudnn"]
mkl = ["dep:intel-mkl-src", "candle/mkl"]
metal = ["candle/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
metal-debug-labels = ["metal", "candle/metal-debug-labels"]

[[bench]]
name = "bench_main"
harness = false
