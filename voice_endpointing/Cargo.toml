[package]
name = "candle-voice-endpointing"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Candle FireRedVAD and Smart Turn v3.2, without Python or ONNX Runtime"

[workspace]

[dependencies]
anyhow = "1"
candle = { package = "candle-core", path = "../candle-core" }
candle-nn = { path = "../candle-nn" }
candle-transformers = { path = "../candle-transformers" }
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = []

[[bin]]
name = "voice-endpointing"
path = "src/main.rs"
