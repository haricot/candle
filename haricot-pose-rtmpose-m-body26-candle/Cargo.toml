[package]
name = "haricot-pose-rtmpose-m-body26-candle"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Candle RTMPose-m Halpe26 reference for HaricotPose"
repository = "https://github.com/haricot/candle"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
cuda-legacy-bf16 = ["cuda", "candle-core/cuda-legacy-bf16"]
cuda-legacy-fp8 = ["cuda", "candle-core/cuda-legacy-fp8"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

candle-core = { path = "../candle-core" }
candle-nn = { path = "../candle-nn" }

[[bin]]
name = "haricot-rtmpose-body26"
path = "src/bin/haricot-rtmpose-body26.rs"

# Keep the RTMPose package independent of the parent Candle workspace.
[workspace]
resolver = "2"
